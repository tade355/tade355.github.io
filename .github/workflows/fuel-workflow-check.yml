name: Fuel workflow checks
on:
  push:
    branches: [codex/fuel-workflow-20261112]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
