name: NaijaBites CI

on:
  push:
    branches: ['**']
    paths: ['naijabites/**', '.github/workflows/naijabites.yml']
  pull_request:
    paths: ['naijabites/**']

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: naijabites_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/naijabites_test
    defaults: { run: { working-directory: naijabites/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: naijabites/backend/package-lock.json }
      - run: npm ci
      - run: npx prisma db push
      - run: npm run typecheck
      - run: npm test

  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: [app, admin] }
    defaults: { run: { working-directory: 'naijabites/${{ matrix.dir }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'naijabites/${{ matrix.dir }}/package-lock.json' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: matrix.dir == 'app'
      - run: npm run build
        if: matrix.dir == 'admin'
